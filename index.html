<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <meta
            name="google-site-verification"
            content="xRqT5pQQETq9o1kaS6i_sFaF7CkRpYhiDLhVEV0IBiU"
        />
        <title>Speaker Test</title>
        <script>
            (function () {
                var languages = navigator.languages && navigator.languages.length
                    ? navigator.languages
                    : [navigator.language || ""];
                var preferred = String(languages[0] || "").toLowerCase();
                var language = preferred.indexOf("es") === 0 ? "es" : "en";
                window.location.replace(
                    "/" + language + window.location.search + window.location.hash
                );
            })();
        </script>
        <noscript><meta http-equiv="refresh" content="0; url=/en" /></noscript>
    </head>
    <body></body>
</html>
