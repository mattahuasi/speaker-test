<!doctype html>
<html lang="en">
  <head>
    <!-- ── Primary Meta ── -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaker Test — Left & Right Channel Stereo Tester</title>
    <meta
      name="description"
      content="Free online stereo speaker test. Play audio to your left or right channel independently to check if your speakers, headphones or sound system are working correctly."
    />
    <meta
      name="keywords"
      content="speaker test, stereo test, left channel test, right channel test, audio test, headphone test, sound test, channel test online"
    />
    <meta name="author" content="Speaker Test" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://domain.com/" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f0f11"
      media="(prefers-color-scheme: dark)"
    />

    <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://domain.com/" />
    <meta
      property="og:title"
      content="Speaker Test — Left & Right Channel Stereo Tester"
    />
    <meta
      property="og:description"
      content="Test your left and right speakers independently. Free, instant, no download needed. Works on any browser."
    />
    <meta property="og:image" content="https://domain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Speaker Test app showing L and R channel buttons"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Speaker Test" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://domain.com/" />
    <meta
      name="twitter:title"
      content="Speaker Test — Left & Right Channel Stereo Tester"
    />
    <meta
      name="twitter:description"
      content="Test your left and right speakers independently. Free, instant, no download needed."
    />
    <meta name="twitter:image" content="https://domain.com/og-image.png" />
    <meta name="twitter:image:alt" content="Speaker Test app" />

    <!-- ── Schema.org JSON-LD (Google Rich Results) ── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Speaker Test",
        "url": "https://domain.com/",
        "description": "Free online stereo speaker test. Play audio to your left or right channel independently.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires Web Audio API",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- ── Favicon mínimo ── -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <span style="font-size: 20px">🔊</span>
        <h1>Speaker Test</h1>
      </div>
      <button
        class="theme-btn"
        id="theme-btn"
        aria-label="Toggle theme"
        title="Toggle dark/light mode"
      >
        🌙
      </button>
    </header>

    <main>
      <div class="speakers-row">
        <button
          class="spk-btn"
          id="btn-left"
          onclick="playChannel('left')"
          aria-label="Test left speaker"
        >
          <span class="spk-badge">L</span>
          <span class="spk-icon">🔉</span>
          <span class="spk-channel">L</span>
          <span class="spk-label">Left</span>
        </button>
        <div class="divider"></div>
        <button
          class="spk-btn"
          id="btn-right"
          onclick="playChannel('right')"
          aria-label="Test right speaker"
        >
          <span class="spk-badge">R</span>
          <span class="spk-icon">🔊</span>
          <span class="spk-channel">R</span>
          <span class="spk-label">Right</span>
        </button>
      </div>

      <button class="both-btn" id="btn-both" onclick="playChannel('both')">
        ⚡ Both channels
      </button>

      <div class="status-bar" id="status">
        Choose a channel to test your speakers
      </div>

      <button class="all-btn" id="btn-seq" onclick="toggleSeq()">
        ▶ Auto-test all channels
      </button>
    </main>

    <footer>
      Stereo Speaker Test &mdash; Real voice, hard-panned per channel
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
